services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: local-demo-password
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u admin -p local-demo-password --authenticationDatabase admin --eval 'db.adminCommand({ping:1})' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://admin:local-demo-password@mongo:27017/?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  mongo_data:
